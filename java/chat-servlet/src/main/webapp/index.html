<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servlet Chat</title>
    <style>
        body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 42rem; padding: 0 1rem; }
        #messages { border: 1px solid #bbb; height: 22rem; list-style: none; overflow-y: auto; padding: 1rem; }
        #messages li { margin: 0 0 .65rem; overflow-wrap: anywhere; }
        form { display: grid; gap: .6rem; grid-template-columns: 10rem 1fr auto; }
        input, button { font: inherit; padding: .5rem; }
        #status { min-height: 1.5em; }
        @media (max-width: 36rem) { form { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>Servlet Chat</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <ol id="messages" aria-label="Chat messages"></ol>
    <form id="chat-form">
        <label>
            Name
            <input id="username" name="username" maxlength="40" required>
        </label>
        <label>
            Message
            <input id="message" name="message" maxlength="1000" autocomplete="off" required>
        </label>
        <button type="submit">Send</button>
    </form>

    <script>
        const messageList = document.getElementById("messages");
        const status = document.getElementById("status");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");
        const form = document.getElementById("chat-form");
        let lastMessageId = 0;
        let polling = false;

        usernameInput.value = localStorage.getItem("chatUsername") || "";

        async function loadMessages() {
            if (polling) return;
            polling = true;
            try {
                const response = await fetch("chat?after=" + lastMessageId, { cache: "no-store" });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Could not load messages.");
                for (const message of result.messages) {
                    const item = document.createElement("li");
                    const sender = document.createElement("strong");
                    sender.textContent = message.user + ": ";
                    item.append(sender, document.createTextNode(message.text));
                    messageList.append(item);
                    lastMessageId = Math.max(lastMessageId, message.id);
                }
                messageList.scrollTop = messageList.scrollHeight;
                status.textContent = "";
            } catch (error) {
                status.textContent = error.message;
            } finally {
                polling = false;
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();
            if (!username || !message) {
                status.textContent = "Enter a name and a message.";
                return;
            }

            const body = new URLSearchParams({ username, message });
            try {
                const response = await fetch("chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                    body
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Could not send message.");
                localStorage.setItem("chatUsername", username);
                messageInput.value = "";
                await loadMessages();
                messageInput.focus();
            } catch (error) {
                status.textContent = error.message;
            }
        });

        loadMessages();
        window.setInterval(loadMessages, 1500);
    </script>
</body>
</html>
